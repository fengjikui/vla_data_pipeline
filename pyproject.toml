[project]
name = "vla-data-pipeline"
version = "0.1.0"
description = "Auditable multi-embodiment robot data pipeline and presentation demo"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.0,<3", "pyarrow==25.0.1", "av>=16,<18", "pillow>=11,<13"]

[project.optional-dependencies]
train = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
vla-pipeline = "vla_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vla_pipeline"]
